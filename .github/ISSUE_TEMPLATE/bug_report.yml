name: Bug report
description: Something codervis does that it should not, or does not do that it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Not for security vulnerabilities.** Report those privately through
        [private vulnerability reporting](https://github.com/jleavers/codervis/security/advisories/new)
        — see [SECURITY.md](https://github.com/jleavers/codervis/blob/main/SECURITY.md).

  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: What you saw, and what you expected instead.
      placeholder: |
        The Codex card reads `unavailable` with `upstream response not understood`, but the
        Codex CLI itself shows usage fine.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest sequence that shows it.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: >
        Whatever you have: `docker compose logs codervis` and `docker compose logs egress`,
        the `/healthz` JSON, the `/api/usage` JSON, a screenshot. **Check it for credentials
        first.** The dashboard never logs or serves a token, but a debug capture of an upstream
        call does carry one, and nothing here can scrub what you paste.
      render: text

  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you are running (`git rev-parse --short HEAD`).
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Host platform
      options:
        - Linux
        - macOS
        - Windows (Docker Desktop)
        - Other or not sure
    validations:
      required: true

  - type: textarea
    id: how-you-would-know
    attributes:
      label: How you would know it is fixed
      description: >
        What is true afterwards that is not true now. Describe the behaviour rather than the
        commands: a maintainer works out what to run, and this field is not a script.
      placeholder: |
        The Codex card reads `live` with a five-hour percentage, against the response shape in
        the evidence above.
