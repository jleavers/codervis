version: 2

# Group routine updates so a quiet week produces one PR per ecosystem. Major
# updates stay separate because they deserve individual review.
updates:
  # The actions used by .github/workflows/ci.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # The two hash-locked dependency sets, requirements.txt and requirements-dev.txt. Grouped
  # so the lock moves as a unit rather than one artefact at a time (#104).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  # The base image in Dockerfile, which is pinned by digest (#104). This is what moves that
  # digest on when the python:3.14-slim tag moves; without it a digest pin is a pin to an
  # image nobody updates.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
