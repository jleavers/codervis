version: 2

# Group routine updates so a quiet week produces one PR per ecosystem. Major
# updates stay separate because they deserve individual review.
updates:
  # The actions used by .github/workflows/ci.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # The three hash-locked dependency sets in this directory: requirements.txt,
  # requirements-dev.txt and requirements-screenshots.txt (#108). Grouped so the locks move
  # as a unit rather than one artefact at a time (#104). The pip updater reads the requirement
  # files of the directories it is told about and no others, so a lock that moves out of this
  # one needs an entry of its own -- tests/test_dependency_lock.py fails if one ever does
  # without getting it.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  # The base image in Dockerfile, which is pinned by digest (#104). This is what moves that
  # digest on when the python:3.14-slim tag moves; without it a digest pin is a pin to an
  # image nobody updates.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
