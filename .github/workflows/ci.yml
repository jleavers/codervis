name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes any in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Starlette's TestClient currently hangs under Python 3.14. The Docker job
  # still smoke-tests the production Python 3.14 image from Dockerfile.
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # Start with Ruff's correctness rules. Enabling its broader opinionated
      # rule set would require unrelated cleanup of the existing codebase.
      - name: Run Ruff
        run: ruff check --select E4,E7,E9,F .

      - name: Byte-compile Python sources
        run: python -m compileall -q app tests

  test-python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # No file list: pytest.ini's testpaths collects all of tests/, so a new
      # test file runs here without anyone having to name it.
      - name: Run Python tests
        run: python -m pytest -q

  test-js:
    name: JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Quoted so that node expands the glob rather than the shell, for the
      # same reason: a new tests/test_*.js runs without being named.
      - name: Run JavaScript tests
        run: node --test 'tests/test_*.js'

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Keep the image in the local daemon so the smoke test can run it.
          load: true
          tags: codervis:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          container_id="$(docker run --detach --publish 127.0.0.1:8765:8000 codervis:ci)"
          trap 'docker stop "$container_id"' EXIT
          curl --fail --silent --show-error \
            --retry 15 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:8765/healthz

      - name: Render Compose config
        env:
          # The runner's own temp directory, not a fixed name in shared /tmp: this job
          # writes nothing there, but the egress job below writes credential-shaped files,
          # and one rule for both is easier to keep than an exception.
          USERPROFILE: ${{ runner.temp }}/codervis-ci
        run: docker compose --env-file .env.example config --quiet

  egress:
    name: Egress bound
    runs-on: ubuntu-latest
    # Synthetic credential files only. Nothing below sends them anywhere: `check` opens CONNECT
    # tunnels and closes them unused, and /healthz makes no upstream call. They go in the
    # runner's temp directory rather than a fixed name in shared /tmp, which anyone who can
    # write /tmp can create first and hand back.
    env:
      CLAUDE_HOME: ${{ runner.temp }}/codervis-ci/claude
      CODEX_HOME: ${{ runner.temp }}/codervis-ci/codex
      DASHBOARD_PORT: 8765
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        run: |
          mkdir -p "$CLAUDE_HOME" "$CODEX_HOME"
          printf '{"claudeAiOauth":{"accessToken":"ci-not-a-token"}}' > "$CLAUDE_HOME/.credentials.json"
          printf '{"tokens":{"access_token":"ci-not-a-token"}}' > "$CODEX_HOME/auth.json"
          docker compose up --build --detach --wait

      - name: Check the bound from inside the dashboard container
        run: docker compose exec -T codervis python -m app.egress check

      - name: Reach the dashboard through ingress
        run: |
          curl --fail --silent --show-error \
            --retry 15 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:8765/healthz

      - name: Show the logs
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down
