name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes any in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Starlette's TestClient currently hangs under Python 3.14. The Docker job
  # still smoke-tests the production Python 3.14 image from Dockerfile.
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # Start with Ruff's correctness rules. Enabling its broader opinionated
      # rule set would require unrelated cleanup of the existing codebase.
      - name: Run Ruff
        run: ruff check --select E4,E7,E9,F .

      - name: Byte-compile Python sources
        run: python -m compileall -q app tests

  test-python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # No file list: pytest.ini's testpaths collects all of tests/, so a new
      # test file runs here without anyone having to name it. REQUIRE_DOCKER
      # turns tests/test_compose_topology.py's "no docker CLI" skip into a
      # failure: a hosted runner has the CLI, and the compose shape it pins --
      # internal networks with no host address on their bridge (#37) -- is not
      # something to lose quietly to a change in the runner image.
      - name: Run Python tests
        env:
          REQUIRE_DOCKER: "1"
        run: python -m pytest -q

  test-js:
    name: JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Quoted so that node expands the glob rather than the shell, for the
      # same reason: a new tests/test_*.js runs without being named.
      - name: Run JavaScript tests
        run: node --test 'tests/test_*.js'

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Keep the image in the local daemon so the smoke test can run it.
          load: true
          tags: codervis:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          container_id="$(docker run --detach --publish 127.0.0.1:8765:8000 codervis:ci)"
          trap 'docker stop "$container_id"' EXIT
          curl --fail --silent --show-error \
            --retry 15 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:8765/healthz

      - name: Render Compose config
        env:
          # Only has to resolve .env.example's ${USERPROFILE} interpolation, so the runner's
          # own temp directory does it -- and unlike a fixed name in shared /tmp, it is not a
          # path a second principal on a self-hosted runner can create first (#30). Step-level
          # `env:`, because the `runner` context is out of scope in a job-level one.
          USERPROFILE: ${{ runner.temp }}
        run: docker compose --env-file .env.example config --quiet

  egress:
    name: Egress bound
    runs-on: ubuntu-latest
    # Synthetic credential files only. Nothing below sends them anywhere: `check` opens CONNECT
    # tunnels and closes them unused, and /healthz makes no upstream call.
    env:
      DASHBOARD_PORT: 8765
    steps:
      - uses: actions/checkout@v7

      # The runner's own temp directory rather than a fixed name in shared /tmp: a GitHub-hosted
      # runner is single-principal, but a self-hosted one is not, and these are
      # credential-shaped files whatever is in them (#30). `mktemp -d` on top, so the name is
      # not one anything else could have created first. They go through $GITHUB_ENV rather than
      # the job-level `env:` above because the `runner` context is out of scope there -- and
      # every later step needs the same two paths, since `up`, `exec` and `down` all interpolate
      # them out of docker-compose.yml.
      - name: Make a private directory for the synthetic credential files
        run: |
          home="$(mktemp -d "${RUNNER_TEMP}/codervis-ci.XXXXXX")"
          mkdir -p "$home/claude" "$home/codex"
          echo "CLAUDE_HOME=$home/claude" >> "$GITHUB_ENV"
          echo "CODEX_HOME=$home/codex" >> "$GITHUB_ENV"

      - name: Start the stack
        run: |
          printf '{"claudeAiOauth":{"accessToken":"ci-not-a-token"}}' > "$CLAUDE_HOME/.credentials.json"
          printf '{"tokens":{"access_token":"ci-not-a-token"}}' > "$CODEX_HOME/auth.json"
          docker compose up --build --detach --wait

      # Which engine honoured the gateway-isolation option, and what it did: an `inside` network
      # whose bridge has no IPv4 address is the compose half of #37 taking effect, and the step
      # below is what asserts it from inside the container. Recorded rather than asserted here,
      # so the run says what the engine was when a newer one changes the option's spelling. The
      # stack has already started at this point, so an engine that refused the option would have
      # failed the step above instead.
      - name: Record the engine version and the inside bridge's addresses
        run: |
          docker version --format 'engine {{.Server.Version}}'
          network="$(docker network ls \
            --filter label=com.docker.compose.network=inside --format '{{.Name}}')"
          docker network inspect "$network" \
            --format 'internal={{.Internal}} options={{json .Options}} ipam={{json .IPAM.Config}}'
          bridge="br-$(docker network inspect "$network" --format '{{.Id}}' | cut -c1-12)"
          ip -4 address show "$bridge" || true

      - name: Check the bound from inside the dashboard container
        run: docker compose exec -T codervis python -m app.egress check

      - name: Reach the dashboard through ingress
        run: |
          curl --fail --silent --show-error \
            --retry 15 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:8765/healthz

      - name: Show the logs
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down
