services:
  codervis:
    build: .
    container_name: codervis
    ports:
      - "${DASHBOARD_PORT:-8765}:8000"
    environment:
      CLAUDE_DATA_DIR: /data/claude
      CODEX_DATA_DIR: /data/codex
      CURSOR_DATA_DIR: /data/cursor
      COPILOT_DATA_DIR: /data/copilot
      CODEX_ENABLED: "${CODEX_ENABLED:-true}"
      CURSOR_ENABLED: "${CURSOR_ENABLED:-true}"
      COPILOT_ENABLED: "${COPILOT_ENABLED:-true}"
      # Copilot PAT mode (for VS Code users whose token isn't in a file).
      # If COPILOT_GITHUB_TOKEN is set, the documented billing REST API is used
      # instead of the apps.json/hosts.json + copilot_internal path.
      COPILOT_GITHUB_TOKEN: "${COPILOT_GITHUB_TOKEN:-}"
      COPILOT_GITHUB_USER: "${COPILOT_GITHUB_USER:-}"
      COPILOT_PLAN: "${COPILOT_PLAN:-pro}"
      COPILOT_PREMIUM_ALLOWANCE: "${COPILOT_PREMIUM_ALLOWANCE:-}"
      COPILOT_SPEND_BUDGET: "${COPILOT_SPEND_BUDGET:-}"
      REFRESH_INTERVAL_SECONDS: "${REFRESH_INTERVAL_SECONDS:-5}"
      QUOTA_CACHE_TTL_SECONDS: "${QUOTA_CACHE_TTL_SECONDS:-30}"
      CLAUDE_ACTIVITY_CACHE_TTL_SECONDS: "${CLAUDE_ACTIVITY_CACHE_TTL_SECONDS:-5}"
      CODEX_ACTIVITY_CACHE_TTL_SECONDS: "${CODEX_ACTIVITY_CACHE_TTL_SECONDS:-5}"
      CURSOR_ACTIVITY_CACHE_TTL_SECONDS: "${CURSOR_ACTIVITY_CACHE_TTL_SECONDS:-5}"
      COPILOT_ACTIVITY_CACHE_TTL_SECONDS: "${COPILOT_ACTIVITY_CACHE_TTL_SECONDS:-5}"
      CLAUDE_AI_HOST: "${CLAUDE_AI_HOST:-https://claude.ai}"
      CHATGPT_HOST: "${CHATGPT_HOST:-https://chatgpt.com}"
      CURSOR_HOST: "${CURSOR_HOST:-https://cursor.com}"
      GITHUB_API_HOST: "${GITHUB_API_HOST:-https://api.github.com}"
    volumes:
      - "${CLAUDE_HOME:-~/.claude}:/data/claude:ro"
      - "${CODEX_HOME:-~/.codex}:/data/codex:ro"
      - "${CURSOR_HOME:-~/.config/Cursor}:/data/cursor:ro"
      - "${COPILOT_HOME:-~/.config/github-copilot}:/data/copilot:ro"
    restart: unless-stopped
