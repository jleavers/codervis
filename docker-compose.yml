# Every service can be made to log by a peer that reaches the port, so each log is capped
# (#20). json-file is named rather than inherited, because max-size is its option and a daemon
# whose default driver lacks it would refuse to create the containers.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  codervis:
    build: .
    container_name: codervis
    # One internal network, with no default route and no address of the host's own on its
    # bridge (see `inside` below): every peer the dashboard can dial is a container in this
    # project, so its one way off the host is the `egress` proxy, and only to the hosts on its
    # allow-list. No `ports:` here -- Docker ignores a published port on an internal-only
    # container, so `ingress` publishes it.
    networks: [inside]
    environment:
      CLAUDE_DATA_DIR: /data/claude
      CODEX_DATA_DIR: /data/codex
      CLAUDE_ENABLED: "${CLAUDE_ENABLED:-true}"
      CODEX_ENABLED: "${CODEX_ENABLED:-true}"
      REFRESH_INTERVAL_SECONDS: "${REFRESH_INTERVAL_SECONDS:-5}"
      # How often each source is read in its own background thread. Nothing a
      # request does can add a read; these intervals are the whole budget.
      # Both names are passed through empty, and the app prefers the new one:
      # keeping the precedence in one place means an existing .env that still
      # sets only *_CACHE_TTL_SECONDS keeps working, with no default repeated
      # here and in the code where the two could drift apart.
      QUOTA_REFRESH_INTERVAL_SECONDS: "${QUOTA_REFRESH_INTERVAL_SECONDS:-}"
      QUOTA_CACHE_TTL_SECONDS: "${QUOTA_CACHE_TTL_SECONDS:-}"
      CLAUDE_ACTIVITY_REFRESH_INTERVAL_SECONDS: "${CLAUDE_ACTIVITY_REFRESH_INTERVAL_SECONDS:-}"
      CLAUDE_ACTIVITY_CACHE_TTL_SECONDS: "${CLAUDE_ACTIVITY_CACHE_TTL_SECONDS:-}"
      CODEX_ACTIVITY_REFRESH_INTERVAL_SECONDS: "${CODEX_ACTIVITY_REFRESH_INTERVAL_SECONDS:-}"
      CODEX_ACTIVITY_CACHE_TTL_SECONDS: "${CODEX_ACTIVITY_CACHE_TTL_SECONDS:-}"
      STARTUP_REFRESH_WAIT_SECONDS: "${STARTUP_REFRESH_WAIT_SECONDS:-}"
      # What a single payload-feeding read may cost: a byte cap on every one of
      # them, and a deadline on the ones that can be given one.
      QUOTA_TIMEOUT_SECONDS: "${QUOTA_TIMEOUT_SECONDS:-}"
      QUOTA_TOTAL_DEADLINE_SECONDS: "${QUOTA_TOTAL_DEADLINE_SECONDS:-}"
      QUOTA_MAX_RESPONSE_BYTES: "${QUOTA_MAX_RESPONSE_BYTES:-}"
      CREDENTIALS_MAX_BYTES: "${CREDENTIALS_MAX_BYTES:-}"
      ACTIVITY_SCAN_DEADLINE_SECONDS: "${ACTIVITY_SCAN_DEADLINE_SECONDS:-}"
      ACTIVITY_MAX_LINE_BYTES: "${ACTIVITY_MAX_LINE_BYTES:-}"
      ACTIVITY_MAX_FILE_BYTES: "${ACTIVITY_MAX_FILE_BYTES:-}"
      ACTIVITY_MAX_FILES: "${ACTIVITY_MAX_FILES:-}"
      CLAUDE_AI_HOST: "${CLAUDE_AI_HOST:-https://claude.ai}"
      CHATGPT_HOST: "${CHATGPT_HOST:-https://chatgpt.com}"
      # The other half of the exposure setting: DASHBOARD_BIND decides which host interface
      # the port appears on, this decides which names may be used to reach it (#15).
      DASHBOARD_ALLOWED_HOSTS: "${DASHBOARD_ALLOWED_HOSTS:-localhost,127.0.0.1,::1}"
      # urllib reads these; both cases, because clients disagree about which one they honour.
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      http_proxy: http://egress:3128
      https_proxy: http://egress:3128
      NO_PROXY: localhost,127.0.0.1,::1
      no_proxy: localhost,127.0.0.1,::1
    volumes:
      - "${CLAUDE_HOME:-~/.claude}:/data/claude:ro"
      - "${CODEX_HOME:-~/.codex}:/data/codex:ro"
    depends_on:
      egress:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # The dashboard's only route out: a CONNECT-only proxy that admits claude.ai and chatgpt.com,
  # plus whatever EGRESS_ALLOW adds (app/egress.py). It sees host names, never a token.
  egress:
    build: .
    command: ["python", "-m", "app.egress", "serve", "--bind", "0.0.0.0", "--port", "3128"]
    networks: [inside, outside]
    environment:
      EGRESS_ALLOW: "${EGRESS_ALLOW:-}"
    # The proxy's own contract rather than a port probe: a name on no list must come back 403.
    healthcheck:
      test: ["CMD", "python", "-m", "app.egress", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
      start_interval: 1s
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  # Publishes the dashboard and copies bytes to and from it (app/ingress.py).
  ingress:
    build: .
    command:
      ["python", "-m", "app.ingress", "--bind", "0.0.0.0", "--port", "8000", "--target", "codervis:8000"]
    networks: [inside, outside]
    # The dashboard has no login, so the operator says which clients it serves rather than
    # leaving it to whichever networks the host happens to join (#15). Published on the
    # loopback address unless DASHBOARD_BIND names another, so by default no LAN peer and no
    # co-resident container reaches it -- neither of which a host firewall would stop, since
    # Docker's DNAT runs ahead of its INPUT rules. Long syntax because an IPv6 address in the
    # short one has to be bracketed to be told from the port.
    ports:
      - host_ip: "${DASHBOARD_BIND:-127.0.0.1}"
        published: "${DASHBOARD_PORT:-8765}"
        target: 8000
        protocol: tcp
    depends_on:
      codervis:
        condition: service_started
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

networks:
  # No default route and no address for the host: joining it adds a path to `egress` and
  # `ingress` and nothing else.
  inside:
    internal: true
    driver: bridge
    # `internal: true` withholds the default route and the forwarding to other networks. On its
    # own it still leaves the host an address on this bridge, which is on-link in the container's
    # own subnet and so reachable with no route at all -- a second way off codervis, to whatever
    # the host listens on (#37). `isolated` is the gateway mode that assigns the bridge no
    # address, so there is nothing on it to dial. Docker Engine 28.1 or newer honours it. An
    # older engine does not refuse it -- the bridge driver ignores a driver option it has no
    # case for -- so the stack starts and the host keeps its address; README's network section
    # says what to do then. `python -m app.egress check` is what proves which you got: with the
    # option honoured no gateway address is allocated at all, so the subnet's first address
    # falls to the first container attached, and finding `egress` there is the evidence.
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    # No `enable_ipv6` here, so IPv6 never reaches this bridge. Turning it on would need
    # `gateway_mode_ipv6: isolated` beside the line above, or the host would have an IPv6
    # address on the bridge and the bound would be back to one family only; the topology test
    # fails if `enable_ipv6` ever appears without it.
  # The only network with a route off the host, joined by the two gateway services alone.
  outside: {}
